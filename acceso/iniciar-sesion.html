<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center">
<div class="w-full max-w-[1000px] mx-margin-mobile md:mx-auto bg-surface-container-lowest rounded-[32px] overflow-hidden flex flex-col md:flex-row soft-shadow min-h-[600px]">

</div>
</div>
</div>
<!-- Form Side -->
<div class="w-full md:w-1/2 p-margin-mobile md:p-xl flex flex-col justify-center bg-surface-container-lowest">
<div class="md:hidden mb-lg">
<a class="font-headline-md text-headline-md font-bold text-primary" href="../index.html">Homely</a>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Inicia sesión en tu cuenta</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">¿No tienes una cuenta? <a class="text-primary font-bold hover:underline decoration-primary" href="registro.html">Regístrate</a></p>
<form action="../cliente/inicio.html" class="space-y-sm mb-md" id="login-form"><div class="mb-md">
<label class="block font-label-md text-label-md text-on-surface mb-xs">¿Cómo quieres ingresar?</label>
<div class="grid grid-cols-2 gap-sm p-xs bg-surface-container rounded-lg">
<button class="h-[40px] flex items-center justify-center rounded-md bg-primary-container text-on-primary font-label-md text-label-md shadow-sm" id="role-client" onclick="selectRole('cliente')" type="button">
      Soy Cliente
    </button>
<button class="h-[40px] flex items-center justify-center rounded-md bg-transparent text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors" id="role-technician" onclick="selectRole('tecnico')" type="button">
      Soy Técnico
    </button>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Correo Electrónico</label>
<input class="w-full h-[48px] px-sm rounded-lg border border-tertiary-container bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md text-on-surface transition-colors" id="email" placeholder="you@example.com" type="email">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs flex justify-between" for="password">
<span class="">Contraseña</span>
<a class="text-primary font-bold hover:underline decoration-primary font-label-sm text-label-sm" href="#">¿Olvidaste tu contraseña?</a>
</label>
<input class="w-full h-[48px] px-sm rounded-lg border border-tertiary-container bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md text-on-surface transition-colors" id="password" placeholder="••••••••" type="password">
</div>
<button class="w-full h-[48px] bg-primary-container text-on-primary font-label-md text-label-md font-bold rounded-lg hover:bg-primary transition-colors mt-md flex justify-center items-center" type="submit">
                    Iniciar Sesión
                </button>
</form>
<div class="flex items-center my-md">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-sm font-label-sm text-label-sm text-on-surface-variant">o continúa con</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<div class="grid grid-cols-2 gap-sm">
<button class="h-[48px] flex items-center justify-center gap-xs rounded-lg border-[1.5px] border-outline-variant bg-transparent hover:bg-surface-container-low transition-colors text-on-surface font-label-md text-label-md">
<span class="material-symbols-outlined filled-icon" data-icon="mail">mail</span>
                    Google
                </button>
<button class="h-[48px] flex items-center justify-center gap-xs rounded-lg border-[1.5px] border-outline-variant bg-transparent hover:bg-surface-container-low transition-colors text-on-surface font-label-md text-label-md">
<span class="material-symbols-outlined" data-icon="smartphone">smartphone</span>
                    Apple
                </button>
</div>
</div>
</div>
<script>
  function selectRole(role) {
    const form = document.getElementById('login-form');
    const client = document.getElementById('role-client');
    const technician = document.getElementById('role-technician');
    const active = 'bg-primary-container text-on-primary shadow-sm';
    const inactive = 'bg-transparent text-on-surface-variant';
    const selected = role === 'tecnico' ? technician : client;
    const other = role === 'tecnico' ? client : technician;
    selected.classList.remove(...inactive.split(' '));
    selected.classList.add(...active.split(' '));
    other.classList.remove(...active.split(' '));
    other.classList.add(...inactive.split(' '));
    form.action = role === 'tecnico'
      ? '../tecnico/inicio.html'
      : '../cliente/inicio.html';
  }
</script>
