<style>
        .map-gradient {
            background: linear-gradient(180deg, rgba(255, 248, 244, 0.8) 0%, rgba(255, 248, 244, 0) 20%, rgba(255, 248, 244, 0) 60%, rgba(255, 248, 244, 1) 100%);
        }
        
        /* Map pin pulse animation */
        @keyframes pin-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }
        .animate-pin-pulse::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background-color: theme('colors.primary-container');
            animation: pin-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            z-index: -1;
        }

        /* Route line dash animation */
        @keyframes dash {
            to { stroke-dashoffset: -20; }
        }
        .route-line {
            stroke-dasharray: 8 6;
            animation: dash 1s linear infinite;
        }
    </style>
